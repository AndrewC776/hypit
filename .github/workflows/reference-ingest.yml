name: Hypit Reference Ingest

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: "Production request JSON containing reference_video_url"
        required: true
        default: "productions/20260916-tiktok-brazil-girl/request.json"
        type: string
  push:
    branches: [main]
    paths:
      - "productions/**/request.json"
      - ".github/workflows/reference-ingest.yml"
      - "scripts/tiktok-browser-ingest.mjs"

permissions:
  contents: read

concurrency:
  group: hypit-reference-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --disable-pip-version-check uv
          uv --version
          ffmpeg -version | head -n 1
          docker --version
          node --version

      - name: Resolve production request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_REQUEST_FILE="productions/20260916-tiktok-brazil-girl/request.json"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST_FILE="${{ inputs.request_file }}"
          else
            REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^productions/.+/request\.json$' | head -n 1 || true)"
            if [ -z "$REQUEST_FILE" ]; then REQUEST_FILE="$DEFAULT_REQUEST_FILE"; fi
          fi

          if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then
            echo "Unable to resolve a production request file: $REQUEST_FILE" >&2
            exit 1
          fi

          JOB_ID="$(jq -er '.job_id' "$REQUEST_FILE")"
          REFERENCE_URL="$(jq -er '.reference_video_url' "$REQUEST_FILE")"

          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "reference_url=$REFERENCE_URL" >> "$GITHUB_OUTPUT"
          echo "Request: $REQUEST_FILE"
          echo "Job: $JOB_ID"

      - name: Download reference with open-source multi-backend ingest
        shell: bash
        env:
          REFERENCE_URL: ${{ steps.request.outputs.reference_url }}
        run: |
          set -euo pipefail
          mkdir -p output/reference output/frames output/dtk-images output/browser-images

          find_video() {
            find output/reference -maxdepth 1 -type f \
              \( -name '*.mp4' -o -name '*.mov' -o -name '*.webm' -o -name '*.mkv' -o -name '*.cobalt' -o -name '*.dtk' -o -name '*.browser' \) \
              | head -n 1 || true
          }

          echo "[backend 1/4] Hypit's pinned yt-dlp + curl-cffi"
          set +e
          uv run --project services/yt-dlp --frozen --with "curl-cffi>=0.13.0" yt-dlp \
            --impersonate chrome \
            --no-playlist \
            --write-info-json \
            --merge-output-format mp4 \
            -S "res:1080" \
            -o "output/reference/reference.%(ext)s" \
            "$REFERENCE_URL"
          YTDLP_STATUS=$?
          set -e
          VIDEO="$(find_video)"

          RESOLVED_URL="$REFERENCE_URL"
          POST_ID=""
          if [ -f output/reference/reference.info.json ]; then
            RESOLVED_URL="$(jq -r '.webpage_url // .original_url // empty' output/reference/reference.info.json)"
            [ -n "$RESOLVED_URL" ] || RESOLVED_URL="$REFERENCE_URL"
            POST_ID="$(jq -r '.id // empty' output/reference/reference.info.json)"
          fi
          if [ -z "$POST_ID" ]; then
            POST_ID="$(printf '%s' "$RESOLVED_URL" | sed -nE 's#.*(/video/|video/)([0-9]{10,25}).*#\2#p' | head -n 1)"
          fi
          echo "Resolved URL: $RESOLVED_URL"
          echo "Post ID: ${POST_ID:-unknown}"

          if [ -z "$VIDEO" ]; then
            echo "yt-dlp yielded no video stream (status=$YTDLP_STATUS)."
            echo "[backend 2/4] self-hosted Cobalt"

            docker pull ghcr.io/imputnet/cobalt:11
            docker run -d --rm --name hypit-cobalt \
              -p 127.0.0.1:9000:9000 \
              -e API_URL="http://127.0.0.1:9000/" \
              ghcr.io/imputnet/cobalt:11
            cleanup_cobalt() { docker rm -f hypit-cobalt >/dev/null 2>&1 || true; }
            trap cleanup_cobalt EXIT

            READY=0
            for _ in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:9000/ >/dev/null 2>&1; then READY=1; break; fi
              sleep 1
            done

            if [ "$READY" -eq 1 ]; then
              jq -n --arg url "$RESOLVED_URL" '{url:$url,videoQuality:"1080",downloadMode:"auto",localProcessing:"disabled",allowH265:true}' \
                > output/reference/cobalt-request.json
              set +e
              COBALT_HTTP="$(curl -sS -o output/reference/cobalt-response.json -w '%{http_code}' \
                -H 'Accept: application/json' -H 'Content-Type: application/json' \
                --data-binary @output/reference/cobalt-request.json http://127.0.0.1:9000/)"
              COBALT_CURL_STATUS=$?
              set -e
              echo "Cobalt HTTP: $COBALT_HTTP curl_status=$COBALT_CURL_STATUS"
              cat output/reference/cobalt-response.json || true

              COBALT_STATUS="$(jq -r '.status // empty' output/reference/cobalt-response.json 2>/dev/null || true)"
              COBALT_URL=""
              case "$COBALT_STATUS" in
                tunnel|redirect) COBALT_URL="$(jq -r '.url // empty' output/reference/cobalt-response.json)" ;;
                picker) COBALT_URL="$(jq -r '[.picker[]? | select(.type == "video")][0].url // empty' output/reference/cobalt-response.json)" ;;
              esac
              if [ -n "$COBALT_URL" ]; then
                set +e
                curl -fL --retry 3 --retry-all-errors "$COBALT_URL" -o output/reference/reference.cobalt
                COBALT_DOWNLOAD=$?
                set -e
                if [ "$COBALT_DOWNLOAD" -ne 0 ]; then rm -f output/reference/reference.cobalt; fi
              fi
            else
              echo "Cobalt did not become ready"
              docker logs hypit-cobalt || true
            fi
            cleanup_cobalt
            trap - EXIT
            VIDEO="$(find_video)"
          fi

          if [ -z "$VIDEO" ]; then
            echo "Cobalt yielded no video."
            echo "[backend 3/4] Evil0ctal/Douyin_TikTok_Download_API v4 (self-hosted)"
            if [ -n "$POST_ID" ]; then
              docker pull evil0ctal/douyin_tiktok_download_api:V4.1.2
              docker run -d --rm --name hypit-dtk -p 127.0.0.1:8080:80 evil0ctal/douyin_tiktok_download_api:V4.1.2
              cleanup_dtk() { docker rm -f hypit-dtk >/dev/null 2>&1 || true; }
              trap cleanup_dtk EXIT

              DTK_READY=0
              for _ in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:8080/docs >/dev/null 2>&1; then DTK_READY=1; break; fi
                sleep 1
              done
              if [ "$DTK_READY" -eq 1 ]; then
                set +e
                DTK_HTTP="$(curl -sS -G -o output/reference/dtk-response.json -w '%{http_code}' \
                  --data-urlencode "itemId=$POST_ID" http://127.0.0.1:8080/api/tiktok/web/fetch_one_video)"
                DTK_CURL_STATUS=$?
                set -e
                echo "DTK HTTP: $DTK_HTTP curl_status=$DTK_CURL_STATUS"
                cat output/reference/dtk-response.json || true

                DTK_URL="$(jq -r '
                  .data.itemInfo.itemStruct.video.playAddr //
                  .data.itemInfo.itemStruct.video.downloadAddr //
                  .data.itemInfo.itemStruct.video.bitrateInfo[0].PlayAddr.UrlList[0] //
                  .data.item_info.item_struct.video.play_addr // empty
                ' output/reference/dtk-response.json 2>/dev/null || true)"
                if [ -n "$DTK_URL" ]; then
                  set +e
                  curl -fL --retry 3 --retry-all-errors \
                    -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/149 Safari/537.36' \
                    -e 'https://www.tiktok.com/' "$DTK_URL" -o output/reference/reference.dtk
                  DTK_DOWNLOAD=$?
                  set -e
                  if [ "$DTK_DOWNLOAD" -ne 0 ]; then rm -f output/reference/reference.dtk; fi
                fi

                if [ ! -f output/reference/reference.dtk ]; then
                  jq -r '
                    .data.itemInfo.itemStruct.imagePost.images[]?.imageURL.urlList[0] //
                    .data.item_info.item_struct.image_post.images[]?.image_url.url_list[0] // empty
                  ' output/reference/dtk-response.json 2>/dev/null > output/reference/dtk-image-urls.txt || true
                  if [ -s output/reference/dtk-image-urls.txt ]; then
                    n=0
                    while IFS= read -r image_url; do
                      [ -n "$image_url" ] || continue
                      n=$((n+1))
                      curl -fL --retry 3 --retry-all-errors "$image_url" -o "output/dtk-images/image_$(printf '%03d' "$n").jpg"
                    done < output/reference/dtk-image-urls.txt
                  fi
                fi
              else
                echo "DTK container did not become ready"
                docker logs hypit-dtk || true
              fi
              cleanup_dtk
              trap - EXIT
            fi
            VIDEO="$(find_video)"
          fi

          if [ -z "$VIDEO" ] && ! find output/dtk-images -type f -name '*.jpg' | grep -q .; then
            echo "API extractors yielded no visual media."
            echo "[backend 4/4] real Chromium/Puppeteer network media capture"
            corepack enable
            corepack prepare pnpm@10.33.0 --activate
            pnpm install --frozen-lockfile
            export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
            echo "Chrome: ${CHROME_BIN:-not-found}"
            set +e
            node scripts/tiktok-browser-ingest.mjs "$RESOLVED_URL" output/reference
            BROWSER_STATUS=$?
            set -e
            echo "Browser ingest status: $BROWSER_STATUS"
            VIDEO="$(find_video)"
          fi

          if [ -z "$VIDEO" ]; then
            SOURCE_IMAGE_DIR=""
            if find output/dtk-images -type f -name '*.jpg' | grep -q .; then SOURCE_IMAGE_DIR="output/dtk-images"; fi
            if [ -z "$SOURCE_IMAGE_DIR" ] && find output/browser-images -type f -name '*.jpg' | grep -q .; then SOURCE_IMAGE_DIR="output/browser-images"; fi

            if [ -n "$SOURCE_IMAGE_DIR" ]; then
              IMAGE_COUNT="$(find "$SOURCE_IMAGE_DIR" -type f -name '*.jpg' | wc -l)"
              AUDIO=""
              [ -f output/reference/reference.mp3 ] && AUDIO="output/reference/reference.mp3"
              PER_IMAGE=2
              if [ -n "$AUDIO" ] && [ "$IMAGE_COUNT" -gt 0 ]; then
                AUDIO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$AUDIO")"
                PER_IMAGE="$(awk -v d="$AUDIO_DURATION" -v n="$IMAGE_COUNT" 'BEGIN { v=d/n; if(v<0.5)v=0.5; printf "%.4f",v }')"
              fi
              find "$SOURCE_IMAGE_DIR" -type f -name '*.jpg' | sort | while read -r image; do
                printf "file '%s'\nduration %s\n" "$(realpath "$image")" "$PER_IMAGE"
              done > output/reference/slideshow.txt
              LAST="$(find "$SOURCE_IMAGE_DIR" -type f -name '*.jpg' | sort | tail -n 1)"
              printf "file '%s'\n" "$(realpath "$LAST")" >> output/reference/slideshow.txt

              if [ -n "$AUDIO" ]; then
                ffmpeg -y -f concat -safe 0 -i output/reference/slideshow.txt -i "$AUDIO" \
                  -vf 'scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:black,fps=30' \
                  -c:v libx264 -pix_fmt yuv420p -crf 18 -c:a aac -b:a 160k -shortest output/reference/reference.mp4
              else
                ffmpeg -y -f concat -safe 0 -i output/reference/slideshow.txt \
                  -vf 'scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:black,fps=30' \
                  -c:v libx264 -pix_fmt yuv420p -crf 18 output/reference/reference.mp4
              fi
              VIDEO="output/reference/reference.mp4"
            else
              echo "All four open-source ingest backends failed to recover visual media." >&2
              exit 1
            fi
          fi

          if [ "$VIDEO" != "output/reference/reference.mp4" ]; then
            ffmpeg -y -i "$VIDEO" -map 0:v:0 -map 0:a? \
              -c:v libx264 -preset fast -crf 18 -c:a aac -b:a 160k -movflags +faststart \
              output/reference/reference.mp4
          fi

          ffprobe -v error \
            -show_entries format=duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,r_frame_rate \
            -of json output/reference/reference.mp4 > output/reference/ffprobe.json
          ffmpeg -y -i output/reference/reference.mp4 -vf "fps=2,scale=720:-2" -q:v 3 output/frames/frame_%04d.jpg

          ls -lh output/reference
          echo "Extracted $(find output/frames -type f -name '*.jpg' | wc -l) analysis frames"

      - name: Upload reference artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-${{ steps.request.outputs.job_id }}
          path: |
            ${{ steps.request.outputs.request_file }}
            output/reference/
            output/frames/
            output/dtk-images/
            output/browser-images/
          if-no-files-found: warn
          retention-days: 14
